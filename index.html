<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Fechô - Controle de gastos mensais simples, rápido e na nuvem."
    />

    <!-- Native iOS / PWA Standalone Chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fechô" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Native iOS Splash Screens (iPhone 16 Lineup + Recent iPhones) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-16-pro-max.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-16-plus.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-16-pro.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-16.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone-14.png"
    />

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Fechô - Controle de Gastos</title>
  </head>
  <body class="bg-[#0A0A0A] text-[#FAFAFA] antialiased select-none">
    <div id="root">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0a0a0a;
        "
      >
        <div
          style="
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #121613;
            border: 1px solid rgba(34, 197, 94, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 36px rgba(34, 197, 94, 0.16);
          "
        >
          <svg width="42" height="42" viewBox="0 0 512 512" fill="none">
            <circle cx="256" cy="256" r="180" stroke="#22C55E" stroke-width="26" stroke-opacity="0.35" />
            <path
              d="M170 260L230 320L342 192"
              stroke="#22C55E"
              stroke-width="38"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
